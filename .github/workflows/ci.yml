# =============================================================================
# HuntAI Test · CI（GitHub Actions）
# =============================================================================
#
# 本文件只做一件事：gitleaks 秘密扫描（凭据防泄漏检查）。
# 原 lint / 类型 / 测试 / 镜像构建门禁 job 已于 2026-10-26 移除，
# 见 docs/13_changes/change_log.md；本地自验命令见 docs/00_setup/project_rules.md §5。
#
# gitleaks 的本地钩子配置在 .pre-commit-config.yaml；CI 这里是同一检查的远端执行。
# =============================================================================

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 拉全量历史，gitleaks 才能扫描完整提交历史而不仅是最新快照。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
